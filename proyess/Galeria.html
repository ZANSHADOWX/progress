<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | El Aroma Perfecto</title>
    <style>
        :root {
            --cafe-oscuro: #4b3621;
            --cafe-claro: #A07855;
            --crema: #FDF5E6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--crema);
            color: var(--cafe-oscuro);
        }

        /* Navegación Simple */
        .nav-galeria {
            background-color: var(--cafe-oscuro);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-galeria a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* --- ESTILOS DEL CARRUSEL --- */
        .slider-container {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
            background-color: #000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active { opacity: 1; }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .slide-content {
            position: absolute;
            text-align: center;
            color: white;
            z-index: 5;
        }

        .slide-content h2 { font-size: 2.5rem; margin: 0; }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 15px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
        }

        .next { right: 20px; }
        .prev { left: 20px; }

        /* --- ESTILOS DE LA REJILLA (GRID) --- */
        .gallery-section {
            padding: 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-galeria {
            columns: 3 250px;
            column-gap: 20px;
        }

        .item-galeria {
            background: white;
            margin-bottom: 20px;
            break-inside: avoid;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .item-galeria:hover { transform: translateY(-5px); }
        .item-galeria img { width: 100%; display: block; }

        footer {
            background: var(--cafe-oscuro);
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }
    </style>
</head>

    <script>
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        function showSlide(index) {
            if (index >= slides.length) currentSlideIndex = 0;
            else if (index < 0) currentSlideIndex = slides.length - 1;
            else currentSlideIndex = index;

            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlideIndex].classList.add('active');
        }

        function changeSlide(n) { showSlide(currentSlideIndex + n); }

        // Cambio automático cada 4 segundos
        setInterval(() => { changeSlide(1); }, 4000);
    </script>
